server {
    listen 80;
    server_name thoughtfull.safwanzarif.dev;
    location = /api {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
    }
}
